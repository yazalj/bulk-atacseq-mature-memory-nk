name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Run AI-agent configuration tests
        run: python -m unittest discover -s tests -v

      - name: Run the synthetic known-output smoke test
        run: python scripts/run_synthetic_demo.py --check

      - name: Check script syntax
        run: |
          python -m compileall -q scripts tests
          bash -n scripts/check_tutorial_installation.sh

      - name: Validate the example AI-agent configuration
        run: >-
          python scripts/validate_agent_configuration.py
          --samples agent/examples/minimal_samples.tsv
          --parameters agent/examples/minimal_parameters.json
          --status agent/examples/minimal_status.json

      - name: Check repository-local Markdown links
        run: python scripts/check_markdown_links.py

      - name: Verify release checksums
        run: python scripts/verify_manifest.py --check

      - name: Build documentation strictly
        run: |
          python scripts/prepare_docs_site.py
          mkdocs build --strict
